# AXIONA EVALÚA: app unificada + Axiona Obra (/obra/) + Axiona Topo (/topo/).
# Se publica dist/ ya compuesto (npm run build:todo). Candado de ingreso: edge function «candado».
[build]
  publish = "dist"
  command = "npm run build:todo"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/derechos/**"]

[functions.obra-dwg]
  included_files = ["netlify/bin/dxf2dwg"]

[[edge_functions]]
  function = "candado"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), accelerometer=(self), gyroscope=(self), xr-spatial-tracking=(self), fullscreen=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mapa/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
